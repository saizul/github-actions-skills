name: Setup
description: Install Node and dependencies
inputs:
  node-version:
    description: Node version
    default: "22"
outputs:
  cache-hit:
    description: Whether the npm cache was hit
    value: ${{ steps.node.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
